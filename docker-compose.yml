# Høstmessa: nettside (PHP), database (MariaDB) og Cloudflare Tunnel.
# Innstillinger og passord ligger i .env (kopier .env.example).

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8080:80"   # Siden på hjemmenettet: http://<NAS-ens IP>:8080
    volumes:
      # Koden leses rett fra NAS-mappen, så endringer i public/ og src/ vises uten ny bygging.
      - ./public:/var/www/public
      - ./src:/var/www/src
      - ./data/uploads:/var/www/public/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: hostmessa
      MARIADB_USER: hostmessa
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./data/db:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
