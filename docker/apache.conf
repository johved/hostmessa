ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/public

    <Directory /var/www/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Opplastede bilder skal aldri kjøres som kode.
    <Directory /var/www/public/uploads>
        php_admin_flag engine off
        <FilesMatch "\.(?!jpg$)[^.]+$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
